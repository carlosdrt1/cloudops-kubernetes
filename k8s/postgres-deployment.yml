apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: cloudops-kubernetes
spec:
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:16
        ports:
          - containerPort: 5432
        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: POSTGRES_PASSWORD
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: POSTGRES_DB

        volumeMounts:
          - name: postgresql-storage
            mountPath: /var/lib/postgresql/data
          - name: postgres-init
            mountPath: /docker-entrypoint-initdb.d

      volumes:
        - name: postgresql-storage
          persistentVolumeClaim:
            claimName: postgresql-data
        - name: postgres-init
          configMap:
            name: postgres-init