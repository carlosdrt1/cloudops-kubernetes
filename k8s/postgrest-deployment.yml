apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: cloudops-kubernetes
spec:
  replicas: 3
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      containers:
      - name: postgrest
        image: postgrest/postgrest
        ports:
        - containerPort: 3000
        - containerPort: 3001

        env:
          - name: PGRST_DB_URI
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: PGRST_DB_URI

          - name: PGRST_DB_SCHEMA
            value: public

          - name: PGRST_DB_ANON_ROLE
            value: web_anon

          - name: PGRST_ADMIN_SERVER_PORT
            value: "3001"

        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

        livenessProbe:
          httpGet:
            path: /live
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
